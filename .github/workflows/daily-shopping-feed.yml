name: Update Troll Shopping Daily Feed

on:
  schedule:
    - cron: "5 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-daily-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate today's feed
        run: python scripts/update_feed.py
      - name: Commit changed feed
        run: |
          git config user.name "Troll Shopping Bot"
          git config user.email "actions@users.noreply.github.com"
          git add troll-shopping-feed.json
          git diff --cached --quiet && exit 0
          git commit -m "Update daily Troll Shopping feed"
          git push
